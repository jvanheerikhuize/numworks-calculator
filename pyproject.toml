[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numworks-probe"
version = "0.1.0"
description = "Hardware, firmware, and script probe toolkit for NumWorks graphing calculators"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.2.1",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
numworks = "numworks.cli:main"
nwprobe = "numworks.cli:main"

[tool.setuptools.packages.find]
include = ["numworks*"]

